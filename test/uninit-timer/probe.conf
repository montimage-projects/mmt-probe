probe-id    = 1
stack-type  = 1
stack-offset = 0
stats-period = 3600
enable-report-version-info = false
input {
    mode        = OFFLINE
    source      = "check.pcap"
    snap-len    = 0
    buffer-size = 0
    timeout     = 0
    pcap-filter = ""
}
output {
    format       = CSV
    cache-max    = 1000
    cache-period = 3600
}
file-output {
    enable = false
}
session-report {
    enable = false
}
reconstruct-data ftp {
    enable = false
}
reconstruct-data http {
    enable = false
}
security {
    enable = false
}
thread-nb    = 3
thread-queue = 64
