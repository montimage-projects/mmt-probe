# Minimal configuration for check_sysreport_period.sh (issue #49:
# 'system-report.period' was parsed into conf->reports.cpu_mem->frequency
# but never used - the system-stats routine fired on a hardcoded 5 s).
# The script rewrites the 'period' line of the system-report block per leg
# and feeds the pcap through a FIFO held open so the routine fires several
# reports before the stream ends.

probe-id    = 1
stack-type  = 1
stack-offset = 0
stats-period = 3600
enable-report-version-info = false

input {
    mode        = OFFLINE
    source      = "check.pcap"
    snap-len    = 0
    buffer-size = 0
    timeout     = 0
    pcap-filter = ""
}

output {
    format       = CSV
    cache-max    = 1000
    cache-period = 3600
}

#the period the check varies: the legs rewrite this line (or remove it, so
# the default of 5 s applies) and count the type-201 rows on stdout
system-report {
    enable         = true
    period         = 5
    output-channel = {stdout}
}

#parsed unconditionally by configure.c: at least one block must exist
reconstruct-data ftp {
    enable = false
}
reconstruct-data http {
    enable = false
}

security {
    enable = false
}

thread-nb    = 1
thread-queue = 2048
