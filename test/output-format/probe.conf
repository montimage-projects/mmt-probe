# Minimal configuration for check_output_format.sh (issue #39: the values
# that output.format and the other enum-like options accept through -X and
# in the configuration file). The script rewrites the 'format' line and
# appends a file-output block writing to its scratch directory.

probe-id    = 1
stack-type  = 1
stack-offset = 0
stats-period = 3600
enable-report-version-info = false

input {
    mode        = OFFLINE
    source      = "check.pcap"
    snap-len    = 0
    buffer-size = 0
    timeout     = 0
    pcap-filter = ""
}

output {
    format       = CSV
    cache-max    = 1000
    cache-period = 3600
}

#the report whose layout output.format changes
session-report {
    enable = true
    output-channel = {file}
}

#socket-output.type is checked on a SOCKET_MODULE build; disabled, it only
# holds the value
socket-output {
    enable = false
}

#parsed unconditionally by configure.c: at least one block must exist
reconstruct-data ftp {
    enable = false
}
reconstruct-data http {
    enable = false
}

security {
    enable = false
}

thread-nb    = 1
thread-queue = 2048
