# Minimal configuration for check_file_output_unset.sh (test for the
# file-output crash of review note N3: an enabled file output without
# output-file made file_output_alloc_init pass NULL to strlen()).
# The file-output/behaviour/dynamic-config blocks each leg checks are
# appended by the script; the behaviour leg also flips session-report on,
# as behaviour.enable requires it.

probe-id    = 1
stack-type  = 1
stack-offset = 0
stats-period = 3600
enable-report-version-info = false

input {
    mode        = OFFLINE
    source      = "check.pcap"
    snap-len    = 0
    buffer-size = 0
    timeout     = 0
    pcap-filter = ""
}

output {
    format       = CSV
    cache-max    = 1000
    cache-period = 3600
}

session-report {
    enable = false
}

#parsed unconditionally by configure.c: at least one block must exist
reconstruct-data ftp {
    enable = false
}
reconstruct-data http {
    enable = false
}

security {
    enable = false
}

thread-nb    = 1
thread-queue = 2048
