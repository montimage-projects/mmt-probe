# Minimal configuration for check_sysreport_channel.sh (issue #43: the
# channel spellings system-report.output-channel accepts through -X and in
# the configuration file). The script appends a file-output block writing
# to its scratch directory and feeds the pcap through a FIFO held open so
# the system-stats routine (one report every 5 seconds) fires once before
# the stream ends.

probe-id    = 1
stack-type  = 1
stack-offset = 0
stats-period = 3600
enable-report-version-info = false

input {
    mode        = OFFLINE
    source      = "check.pcap"
    snap-len    = 0
    buffer-size = 0
    timeout     = 0
    pcap-filter = ""
}

output {
    format       = CSV
    cache-max    = 1000
    cache-period = 3600
}

#the report whose channel the check overrides: {stdout} in the file, moved
# to the file output (or refused) by the legs
system-report {
    enable         = true
    period         = 5
    output-channel = {stdout}
}

#parsed unconditionally by configure.c: at least one block must exist
reconstruct-data ftp {
    enable = false
}
reconstruct-data http {
    enable = false
}

security {
    enable = false
}

thread-nb    = 1
thread-queue = 2048
