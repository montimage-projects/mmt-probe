# Configuration for check_mqtt_dead_channel.sh (issue #53, review F2):
# an MQTT-only report channel pointed at a port nothing listens on. The
# system report ticks every 5 seconds onto the mqtt and stdout channels,
# so each tick exercises mqtt_output_send(): on the unfixed code every
# report is dropped silently once the init connect has failed; on the
# fixed code the drops are counted, warned about once per interval and
# the channel retries the broker periodically.

probe-id    = 1
stack-type  = 1
stack-offset = 0
stats-period = 3600
enable-report-version-info = false

input {
    mode        = OFFLINE
    source      = "check.pcap"
    snap-len    = 0
    buffer-size = 0
    timeout     = 0
    pcap-filter = ""
}

output {
    format       = CSV
    cache-max    = 1000
    cache-period = 3600
}

mqtt-output {
    enable    = true
    address   = "tcp://127.0.0.1:18883"
    topic     = "mmt-i53-dead-channel"
    retain    = false
}

#the report frequency is hardcoded to one report every 5 seconds
# (system_stats.c: timer_1 == 5); period is parsed but unused
system-report {
    enable = true
    period = 5
    output-channel = { mqtt, stdout }
}

#parsed unconditionally by configure.c: at least one block must exist
reconstruct-data ftp {
    enable = false
}
reconstruct-data http {
    enable = false
}

security {
    enable = false
}

session-report {
    enable = false
}

thread-nb    = 1
thread-queue = 2048
