# Minimal configuration for check_mqtt_output.sh (test for the
# conf_update_output_enable() fix: an MQTT-only enabled output was not
# counted, leaving context->output NULL even though mqtt-output.enable).
# MQTT points at 127.0.0.1 on a port nothing listens on: on an
# MQTT_MODULE build the channel fails to connect but the output must be
# allocated and the probe must run to the end of the pcap; on builds
# without MQTT the enabled block still proves output was allocated, as
# the session reports appear on stdout.

probe-id    = 1
stack-type  = 1
stack-offset = 0
stats-period = 3600
enable-report-version-info = false

input {
    mode        = OFFLINE
    source      = "check.pcap"
    snap-len    = 0
    buffer-size = 0
    timeout     = 0
    pcap-filter = ""
}

output {
    format       = CSV
    cache-max    = 1000
    cache-period = 3600
}

mqtt-output {
    enable    = true
    address   = "tcp://127.0.0.1:19831"
    topic     = "mqtt-output-test"
    retain    = false
}

#parsed unconditionally by configure.c: at least one block must exist
reconstruct-data ftp {
    enable = false
}
reconstruct-data http {
    enable = false
}

security {
    enable = false
}

session-report {
    enable = true
    output-channel = { stdout }
}

thread-nb    = 1
thread-queue = 2048
