# Minimal configuration for check_snaplen.sh (test for issue #1).
# check_snaplen.sh overrides input.snap-len, thread-nb and thread-queue via
# probe's -X option; all reporting outputs stay disabled so that a run only
# exercises the pcap -> ring -> worker path.

probe-id    = 1
stack-type  = 1
stack-offset = 0
stats-period = 3600
enable-report-version-info = false

input {
    mode        = OFFLINE
    source      = "check.pcap"
    snap-len    = 0
    buffer-size = 0
    timeout     = 0
    pcap-filter = ""
}

output {
    format       = CSV
    cache-max    = 1000
    cache-period = 3600
}

file-output {
    enable = false
}

session-report {
    enable = false
}

#parsed unconditionally by configure.c: at least one block must exist
reconstruct-data ftp {
    enable = false
}
reconstruct-data http {
    enable = false
}

security {
    enable = false
}

thread-nb    = 1
thread-queue = 2048
